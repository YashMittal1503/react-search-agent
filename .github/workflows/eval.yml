name: Live eval (manual)

# Runs the golden set against real free-tier models. Manual only, to protect free quotas.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: smoke or full
        default: smoke

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
      MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m evals run --suite ${{ inputs.suite }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/evals/reports/
