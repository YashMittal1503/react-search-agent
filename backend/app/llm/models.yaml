# llm_pool configuration. Tiers are ordered fallback chains of "provider:model".
# A provider without keys in the environment is skipped automatically.
# Check what is alive with:  python -m llm_pool.healthcheck --config models.yaml [--tools]
#
# Free-tier notes (Nov 2026):
#   groq        30 RPM, 1K RPD, 8K TPM, 200K TPD *per model*. gpt-oss-20b stalls streams; compound-mini retired.
#   nvidia      ~40 RPM, prototyping only. nemotron-3-ultra / minimax-m3.1-flash are live; gpt-oss-120b retired.
#   mistral     free "Experiment" mode, per-project caps.
#   gemini      per-project caps shown in AI Studio; free-tier prompts may be used for training.
#   openrouter  ":free" models: 20 RPM, 50 RPD (1K after a one-time $10). Failed calls count too.
#   cerebras    no lasting free tier (one-time $5 trial that needs a card), so it is not used here.
#   Several keys from ONE account share that account's quota; real headroom comes from more providers.
#   If all of a provider's keys come from one account, set `shared_quota: true` below (or
#   <PREFIX>_SHARED_QUOTA=true in .env): one 429 then cools every key instead of burning a call on each.

max_wait_seconds: 20     # wait this long for a cooling key before giving up
max_attempts: 20         # attempts per call across all targets and keys

providers:
  groq:
    max_request_tokens: 8000   # free tier: 8K tokens/min per model, so a bigger request can never succeed
  # gemini resets daily quotas at midnight Pacific and openrouter at midnight UTC (built-in defaults).
  openrouter:
    headers:
      HTTP-Referer: "https://github.com/YashMittal1503/react-search-agent"
      X-Title: "react-search-agent"

# When a tier runs out, borrow the ready targets of these tiers before waiting on a cooling key.
# (judge has none on purpose: it must stay a different model family from the agent.)
fallbacks:
  fast: [agent]
  agent: [long_context]
  deep: [agent, long_context]
  long_context: [agent]

# Per-target request ceilings, for models whose limit differs from their provider's.
# 413s that name a limit ("Limit 6000, Requested 9000") are learned at runtime as well.
limits: {}

tiers:
  fast:                     # routing, classification, follow-ups (short prompts)
    - groq:qwen/qwen3.8-27b
    - groq:openai/gpt-oss-120b
    - gemini:gemini-3.5-flash-lite
    - mistral:ministral-3b-2512
    - nvidia:minimaxai/minimax-m3.1-flash
    - openrouter:google/gemma-4-31b-it:free

  agent:                    # tool calling with small contexts (quick ReAct + research subagents)
    - groq:openai/gpt-oss-120b
    - nvidia:minimaxai/minimax-m3.1-flash
    - groq:qwen/qwen3.8-27b
    - gemini:gemini-3.8-flash
    - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia:nvidia/nemotron-3-ultra-550b-a55b
    - gemini:gemini-3.5-flash
    - mistral:mistral-small-latest

  deep:                     # deep-research orchestrator: big, growing context -> high-TPM providers first
    - nvidia:minimaxai/minimax-m3.1-flash
    - gemini:gemini-3.8-flash
    - nvidia:nvidia/nemotron-3-ultra-550b-a55b
    - gemini:gemini-3.5-flash
    - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
    - groq:openai/gpt-oss-120b

  long_context:             # answer synthesis over many sources (1M-token Gemini first)
    - gemini:gemini-3.8-flash
    - nvidia:minimaxai/minimax-m3.1-flash
    - nvidia:nvidia/nemotron-3-ultra-550b-a55b
    - groq:openai/gpt-oss-120b
    - gemini:gemini-3.5-flash
    - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
    - groq:qwen/qwen3.8-27b
    - gemini:gemini-3.5-flash-lite

  judge:                    # evals: a different family from the agent's primary model
    - gemini:gemini-3.5-flash
    - gemini:gemini-3.5-flash-lite
    - mistral:mistral-small-latest
    - nvidia:minimaxai/minimax-m3.1-flash
